<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, initial-scale=1">
  <title>CineCast</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: #0a0a0a; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 22px;
    }

    /* ── focus ring for d-pad nav ── */
    :focus { outline: 4px solid #e50914; outline-offset: 3px; border-radius: 6px; }
    :focus:not(:focus-visible) { outline: none; }
    :focus-visible { outline: 4px solid #e50914; outline-offset: 3px; }

    /* ── full-screen loading state ── */
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0a0a0a; gap: 32px;
    }
    .spinner {
      width: 72px; height: 72px; border-radius: 50%;
      border: 6px solid rgba(255,255,255,0.15);
      border-top-color: #e50914;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-label { font-size: 24px; color: #aaa; }

    /* ── setup screen ── */
    #setup {
      display: none;
      position: fixed; inset: 0;
      flex-direction: column; align-items: center; justify-content: center;
      background: #0a0a0a; gap: 0;
    }
    #setup.visible { display: flex; }

    .logo-wrap { display: flex; align-items: center; gap: 16px; margin-bottom: 60px; }
    .logo-icon {
      width: 80px; height: 80px; border-radius: 20px;
      background: #141414; border: 2px solid #222;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-svg { width: 52px; height: 52px; }
    .logo-text { font-size: 52px; font-weight: 700; letter-spacing: -1px; }
    .logo-text span { color: #e50914; }

    .card {
      background: #141414; border: 1px solid #222;
      border-radius: 16px; padding: 52px 64px;
      width: 860px; display: flex; flex-direction: column; gap: 28px;
    }
    .card-title { font-size: 30px; font-weight: 600; color: #fff; }
    .card-sub { font-size: 20px; color: #888; line-height: 1.5; }

    label { font-size: 20px; color: #ccc; display: block; margin-bottom: 10px; }

    input[type="text"] {
      width: 100%; padding: 20px 24px; font-size: 22px;
      background: #1e1e1e; border: 1px solid #333; border-radius: 10px;
      color: #fff; outline: none; transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #e50914; outline: 4px solid rgba(229,9,20,0.35);
      outline-offset: 0;
    }

    .presets { display: flex; gap: 14px; flex-wrap: wrap; }
    .preset-btn {
      padding: 14px 22px; font-size: 18px; border-radius: 8px;
      background: #1e1e1e; border: 1px solid #333; color: #ccc;
      cursor: pointer; transition: all 0.15s;
    }
    .preset-btn:hover, .preset-btn:focus { background: #2a2a2a; color: #fff; border-color: #555; }

    .actions { display: flex; gap: 18px; margin-top: 8px; }
    .btn-connect {
      flex: 1; padding: 22px; font-size: 24px; font-weight: 600;
      background: #e50914; border: none; border-radius: 10px;
      color: #fff; cursor: pointer; transition: background 0.15s;
    }
    .btn-connect:hover, .btn-connect:focus { background: #c10812; }
    .btn-clear {
      padding: 22px 32px; font-size: 20px; font-weight: 500;
      background: #1e1e1e; border: 1px solid #333; border-radius: 10px;
      color: #888; cursor: pointer; transition: all 0.15s;
    }
    .btn-clear:hover, .btn-clear:focus { background: #2a2a2a; color: #ccc; border-color: #555; }

    .status {
      font-size: 18px; color: #e50914; min-height: 28px;
      text-align: center; margin-top: -8px;
    }

    .hint {
      font-size: 17px; color: #555; text-align: center; margin-top: 24px;
    }
  </style>
</head>
<body>

<!-- Loading spinner shown while checking localStorage -->
<div id="loading">
  <div class="spinner"></div>
  <span class="loading-label">Connecting to CineCast…</span>
</div>

<!-- Setup screen shown when no server URL is saved -->
<div id="setup">
  <div class="logo-wrap">
    <div class="logo-icon">
      <svg class="logo-svg" viewBox="0 0 52 52" fill="none">
        <circle cx="26" cy="26" r="20" stroke="#e50914" stroke-width="7" stroke-dasharray="90 40" stroke-dashoffset="-10"/>
        <circle cx="26" cy="26" r="8" fill="#e50914"/>
      </svg>
    </div>
    <div class="logo-text">Cine<span>Cast</span></div>
  </div>

  <div class="card">
    <div>
      <div class="card-title">Connect to your CineCast server</div>
      <div class="card-sub">Enter the IP address of the machine running your CineCast backend&nbsp;+&nbsp;frontend.</div>
    </div>

    <div>
      <label for="server-url">Server URL</label>
      <input id="server-url" type="text" value="http://localhost:3000"
             placeholder="http://192.168.1.x:3000" autocomplete="off" spellcheck="false"/>
    </div>

    <div>
      <label>Quick presets</label>
      <div class="presets">
        <button class="preset-btn" data-url="http://localhost:3000">localhost</button>
        <button class="preset-btn" data-url="http://192.168.1.100:3000">192.168.1.100</button>
        <button class="preset-btn" data-url="http://192.168.0.100:3000">192.168.0.100</button>
        <button class="preset-btn" data-url="http://10.0.0.10:3000">10.0.0.10</button>
      </div>
    </div>

    <div class="status" id="status-msg"></div>

    <div class="actions">
      <button class="btn-connect" id="btn-connect">Connect</button>
      <button class="btn-clear" id="btn-clear">Forget saved server</button>
    </div>
  </div>

  <div class="hint">
    Press <strong>Enter / OK</strong> to confirm · Use <strong>▲ ▼ ◀ ▶</strong> to navigate · Press <strong>Back</strong> to exit
  </div>
</div>

<script>
(function () {
  var STORAGE_KEY = 'cinecast_server_url';

  function redirect(url) {
    document.getElementById('loading').style.display = 'flex';
    document.getElementById('setup').classList.remove('visible');
    window.location.href = url;
  }

  function showSetup() {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('setup').classList.add('visible');
    document.getElementById('server-url').focus();
  }

  function saveAndConnect() {
    var url = document.getElementById('server-url').value.trim();
    if (!url) {
      document.getElementById('status-msg').textContent = 'Please enter a server URL.';
      return;
    }
    // Basic normalisation
    if (!url.startsWith('http')) url = 'http://' + url;
    localStorage.setItem(STORAGE_KEY, url);
    redirect(url);
  }

  // ── Boot: check for saved URL ──────────────────────────────────────────────
  var saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    redirect(saved);
  } else {
    showSetup();
  }

  // ── UI events ──────────────────────────────────────────────────────────────
  document.getElementById('btn-connect').addEventListener('click', saveAndConnect);

  document.getElementById('btn-clear').addEventListener('click', function () {
    localStorage.removeItem(STORAGE_KEY);
    document.getElementById('status-msg').textContent = 'Saved server cleared.';
    document.getElementById('server-url').value = 'http://localhost:3000';
  });

  document.querySelectorAll('.preset-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.getElementById('server-url').value = btn.getAttribute('data-url');
      document.getElementById('server-url').focus();
    });
  });

  document.getElementById('server-url').addEventListener('keydown', function (e) {
    if (e.keyCode === 13) saveAndConnect();
  });

  // ── webOS remote key handling ──────────────────────────────────────────────
  document.addEventListener('keydown', function (e) {
    if (e.keyCode === 461) {          // Back button on LG remote
      if (window.webOSSystem) {
        window.webOSSystem.platformBack();
      } else {
        window.history.back();
      }
    }
    if (e.keyCode === 13) {           // OK / Enter — click focused element
      var el = document.activeElement;
      if (el && el !== document.getElementById('server-url')) {
        el.click();
      }
    }
  });
})();
</script>
</body>
</html>
